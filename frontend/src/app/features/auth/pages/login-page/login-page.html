<section class="window">
  <div class="titlebar">INGRESE SU IDENTIFICACION</div>

  <div class="brand">
    <img src="assets/images/banner2vsiaf.jpg" alt="vSIAF - Sistema de Activos Fijos" />
  </div>

  <form class="login" [formGroup]="form" (ngSubmit)="submit()">
    <h2 class="login-title">Login</h2>

    <label class="row">
      <span>Nombre del Usuario:</span>
      <input type="text" formControlName="username" autocomplete="username" required />
    </label>

    <label class="row">
      <span>Contraseña:</span>
      <input type="password" formControlName="password" autocomplete="current-password" required />
    </label>

    @if (error(); as message) {
      <p class="error" role="alert">{{ message }}</p>
    }

    <div class="actions">
      <strong>Respeta mayúsculas y minúsculas</strong>
      <button type="submit" [disabled]="loading()">Aceptar</button>
    </div>
  </form>

  <footer class="footer">
    <strong>SIS-414 · Examen final</strong>
    <span>Juan Alex Chambi Montes</span>
  </footer>
</section>
